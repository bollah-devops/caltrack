# Local development stack: Postgres + (optionally) the API.
# Run:  docker compose up -d
# This is all you need on your machine to develop for free.

services:
  db:
    image: postgres:16-alpine
    container_name: calorie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calorie
      POSTGRES_PASSWORD: devpassword        # change for anything real
      POSTGRES_DB: calorie
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # auto-run schema on first startup:
      - ../backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorie"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment once the backend has a Dockerfile:
  # api:
  #   build: ../backend
  #   container_name: calorie_api
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgres://calorie:devpassword@db:5432/calorie
  #     JWT_SECRET: change_me_in_production
  #   ports:
  #     - "3000:3000"

volumes:
  db_data:
